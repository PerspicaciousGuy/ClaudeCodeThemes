</style></head><body><header><h1>Claude Code Themes</h1><p>Every backdrop in the library, animated. The app also tints its panels to match; this page shows the scenes only (themes with colors only show their palette). <a href="https://github.com/PerspicaciousGuy/ClaudeCodeThemes">Install and make your own</a>.</p></header><main><figure><div class="art"><img class="scene" src="previews/abyss-lantern.svg" alt="abyss-lantern" loading="lazy"></div><figcaption><strong>abyss-lantern</strong><span>The deep sea: sun shafts fading into the dark, glowing jellyfish, swaying kelp, bubbles and a passing school of fish. Dark.</span><code>/plugin install abyss-lantern --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/arcade-hall.svg" alt="arcade-hall" loading="lazy"></div><figcaption><strong>arcade-hall</strong><span>A pixel-art arcade at night: rows of cabinets playing their own little games, neon tubes and a patterned carpet. Dark.</span><code>/plugin install arcade-hall --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/art-deco.svg" alt="art-deco" loading="lazy"></div><figcaption><strong>art-deco</strong><span>A 1920s deco poster: a gold sunburst over deep navy, stepped towers with gold-lined windows, concentric fan arcs and a shimmer of light crossing the gold. Dark.</span><code>/plugin install art-deco --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/aurora-field.svg" alt="aurora-field" loading="lazy"></div><figcaption><strong>aurora-field</strong><span>Northern lights over a frozen lake ringed by pines, with twinkling stars and the odd shooting star. Dark.</span><code>/plugin install aurora-field --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/autumn-forest.svg" alt="autumn-forest" loading="lazy"></div><figcaption><strong>autumn-forest</strong><span>A forest in autumn at golden dusk: trees in red, orange and gold, leaves spiraling down, slanting light and a carpet of fallen leaves. Dark.</span><code>/plugin install autumn-forest --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/bamboo-grove.svg" alt="bamboo-grove" loading="lazy"></div><figcaption><strong>bamboo-grove</strong><span>A bamboo grove in morning mist: tall green stalks in layers fading into haze, leaves swaying, slow light shafts and a few leaves falling. Light.</span><code>/plugin install bamboo-grove --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/beacon-cove.svg" alt="beacon-cove" loading="lazy"></div><figcaption><strong>beacon-cove</strong><span>An animated pixel-art theme that follows your clock: a lighthouse cape and sea from night through dawn, day and dusk, with a moving sun and moon, drifting clouds, a small boat and fireflies.</span><code>/plugin install beacon-cove --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/blueprint.svg" alt="blueprint" loading="lazy"></div><figcaption><strong>blueprint</strong><span>An architect's blueprint: a fine grid on deep blue paper, with a gear, a house elevation, a beam section and a compass drawing that trace themselves in white line. Dark.</span><code>/plugin install blueprint --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/campfire.svg" alt="campfire" loading="lazy"></div><figcaption><strong>campfire</strong><span>A night camp whose fire follows your 5-hour usage window and whose woodpile follows your context window: a roaring fire when plenty is left, embers when you are near the limit. A live theme. Dark.</span><code>/plugin install campfire --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/cassette-futurism.svg" alt="cassette-futurism" loading="lazy"></div><figcaption><strong>cassette-futurism</strong><span>A 1980s vision of the future: an amber monochrome console with a sweeping radar, a spectrum, scrolling data, turning cassette reels, blinking lights and scanlines. Dark.</span><code>/plugin install cassette-futurism --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/circuit-board.svg" alt="circuit-board" loading="lazy"></div><figcaption><strong>circuit-board</strong><span>A green circuit board: traces between pads and chips, bright pulses of light running along them and small LEDs blinking on their own beats. Dark.</span><code>/plugin install circuit-board --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/circuit-board-calm.svg" alt="circuit-board-calm" loading="lazy"></div><figcaption><strong>circuit-board-calm</strong><span>A calm version of circuit-board: the same scene slowed to about 40% speed and softened under a veil, with heavier frosted panels, for when motion is distracting. Dark</span><code>/plugin install circuit-board-calm --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/cloud-sea.svg" alt="cloud-sea" loading="lazy"></div><figcaption><strong>cloud-sea</strong><span>Sunrise above a sea of clouds: rolling banks of cloud drifting between dark peaks, a low sun, birds and a pastel sky from peach to blue. Light.</span><code>/plugin install cloud-sea --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/code-rain.svg" alt="code-rain" loading="lazy"></div><figcaption><strong>code-rain</strong><span>Columns of falling glyphs in phosphor green, bright at the head and fading behind, dimmer under the chat. Dark.</span><code>/plugin install code-rain --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/code-rain-calm.svg" alt="code-rain-calm" loading="lazy"></div><figcaption><strong>code-rain-calm</strong><span>A calm version of code-rain: the same scene slowed to about 40% speed and softened under a veil, with heavier frosted panels, for when motion is distracting. Dark</span><code>/plugin install code-rain-calm --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/colorblind-safe-dark.png" alt="colorblind-safe-dark" loading="lazy"></div><figcaption><strong>colorblind-safe-dark</strong><span>A dark theme whose colors stay apart for red-green and blue-yellow color blindness: blue and orange for added and removed, and a different lightness for each status. Colors only.</span><code>/plugin install colorblind-safe-dark --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/colorblind-safe-light.png" alt="colorblind-safe-light" loading="lazy"></div><figcaption><strong>colorblind-safe-light</strong><span>A light theme whose colors stay apart for red-green and blue-yellow color blindness: blue and orange for added and removed, and a different lightness for each status. Colors only.</span><code>/plugin install colorblind-safe-light --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/constellations.svg" alt="constellations" loading="lazy"></div><figcaption><strong>constellations</strong><span>A star map: rings and meridians of a celestial chart on deep blue, with constellations that draw themselves star to star, hold, then fade, and shooting stars. Dark.</span><code>/plugin install constellations --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/contour-map.svg" alt="contour-map" loading="lazy"></div><figcaption><strong>contour-map</strong><span>A topographic survey on warm paper: elevation lines draw themselves one height at a time around a flat basin. Light.</span><code>/plugin install contour-map --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/contour-map-night.svg" alt="contour-map-night" loading="lazy"></div><figcaption><strong>contour-map-night</strong><span>The topographic survey in pale ink on blue-black paper, with the contours drawing themselves. Dark.</span><code>/plugin install contour-map-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/coral-reef.svg" alt="coral-reef" loading="lazy"></div><figcaption><strong>coral-reef</strong><span>A sunlit coral reef: caustic light rippling over branching corals and sea fans, schools of bright fish, a clownfish in an anemone, a turtle gliding by and rising bubbles. Dark.</span><code>/plugin install coral-reef --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/coral-reef-calm.svg" alt="coral-reef-calm" loading="lazy"></div><figcaption><strong>coral-reef-calm</strong><span>A calm version of coral-reef: the same scene slowed to about 40% speed and softened under a veil, with heavier frosted panels, for when motion is distracting. Dark</span><code>/plugin install coral-reef-calm --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/desert-night.svg" alt="desert-night" loading="lazy"></div><figcaption><strong>desert-night</strong><span>A desert after dark: stars and a cold moon over blue-violet mesas, saguaros in silhouette, a campfire with sparks and an owl. Dark.</span><code>/plugin install desert-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/desert-noon.svg" alt="desert-noon" loading="lazy"></div><figcaption><strong>desert-noon</strong><span>A bright desert at midday: red mesas, a pale sun, saguaros, heat shimmer, drifting dust and a tumbleweed. Light.</span><code>/plugin install desert-noon --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/fog-valley.svg" alt="fog-valley" loading="lazy"></div><figcaption><strong>fog-valley</strong><span>A misty mountain morning: blue ridges with fog drifting between them, low sun rays, a flock of birds and a far balloon. Light.</span><code>/plugin install fog-valley --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/fog-valley-night.svg" alt="fog-valley-night" loading="lazy"></div><figcaption><strong>fog-valley-night</strong><span>A misty mountain night: a moon over deep-blue ridges, pale fog drifting between them, fireflies in the pines and a sky lantern rising. Dark.</span><code>/plugin install fog-valley-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/forest-floor.png" alt="forest-floor" loading="lazy"></div><figcaption><strong>forest-floor</strong><span>Moss, bark and fern: a green-brown dark theme and a pale lichen light one, with a fern-green accent. Colors only.</span><code>/plugin install forest-floor --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/forest-trail.svg" alt="forest-trail" loading="lazy"></div><figcaption><strong>forest-trail</strong><span>A pixel-art forest trail on a bright morning: sunbeams through layered trees, a winding dirt path, drifting mist, butterflies and falling leaves. Light.</span><code>/plugin install forest-trail --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/graphite.png" alt="graphite" loading="lazy"></div><figcaption><strong>graphite</strong><span>Neutral graphite grays with one steel-blue accent. Quiet and tool-like, light and dark, colors only.</span><code>/plugin install graphite --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/greenhouse-rain.svg" alt="greenhouse-rain" loading="lazy"></div><figcaption><strong>greenhouse-rain</strong><span>A glass greenhouse at dusk in the rain: streaks and drops running down the panes, big leaves and ferns swaying inside, warm hanging lamps and a drifting mist. Dark.</span><code>/plugin install greenhouse-rain --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/halftone-harbor.svg" alt="halftone-harbor" loading="lazy"></div><figcaption><strong>halftone-harbor</strong><span>A two-ink halftone print of a harbor at sunset: a coral sun and its wake, blue water, a headland with a lighthouse, two boats. Light.</span><code>/plugin install halftone-harbor --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/halftone-harbor-night.svg" alt="halftone-harbor-night" loading="lazy"></div><figcaption><strong>halftone-harbor-night</strong><span>The halftone harbor printed on night-blue stock: an ember sun and pale-blue water in breathing dots. Dark.</span><code>/plugin install halftone-harbor-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/halloween-night.svg" alt="halloween-night" loading="lazy"></div><figcaption><strong>halloween-night</strong><span>A haunted hill on Halloween: a huge orange moon, a crooked manor with flickering windows, bats, drifting ghosts, glowing jack-o'-lanterns and fog among the gravestones. Dark. A vector companion to haunted-manor.</span><code>/plugin install halloween-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/harvest-moon.svg" alt="harvest-moon" loading="lazy"></div><figcaption><strong>harvest-moon</strong><span>A huge orange moon over a wheat field: wheat swaying in waves, hay bales and a barn in silhouette, crows crossing the moon and stars coming out. Dark.</span><code>/plugin install harvest-moon --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/haunted-manor.svg" alt="haunted-manor" loading="lazy"></div><figcaption><strong>haunted-manor</strong><span>A pixel-art haunted manor under a huge moon: flickering windows, bats crossing the sky, a bare tree, drifting ground fog and an iron fence. Dark.</span><code>/plugin install haunted-manor --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/hearth.svg" alt="hearth" loading="lazy"></div><figcaption><strong>hearth</strong><span>A warm theme: espresso and cream surfaces, terracotta accents, and a slow dusk backdrop with embers drifting up.</span><code>/plugin install hearth --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/high-contrast-dark.png" alt="high-contrast-dark" loading="lazy"></div><figcaption><strong>high-contrast-dark</strong><span>Pure black and white with bright, saturated colors: text well past the AA bar on every surface, and strong borders. Dark, colors only.</span><code>/plugin install high-contrast-dark --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/high-contrast-light.png" alt="high-contrast-light" loading="lazy"></div><figcaption><strong>high-contrast-light</strong><span>Black on white with deep, saturated colors: text well past the AA bar on every surface, and strong borders. Light, colors only.</span><code>/plugin install high-contrast-light --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/ink-wash.svg" alt="ink-wash" loading="lazy"></div><figcaption><strong>ink-wash</strong><span>A sumi-e painting on rice paper: mountains in grey washes fading into mist, a pine branch, a lone boat, birds crossing and a red seal. Light.</span><code>/plugin install ink-wash --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/isometric-room.svg" alt="isometric-room" loading="lazy"></div><figcaption><strong>isometric-room</strong><span>A small isometric room at night: a desk with a glowing monitor and lamp, a plant, a bookshelf, a window onto a moonlit sky and a cat asleep on the rug. Dark.</span><code>/plugin install isometric-room --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/koi-pond.svg" alt="koi-pond" loading="lazy"></div><figcaption><strong>koi-pond</strong><span>A koi pond seen from above at dusk: orange and white koi gliding in slow loops, lily pads with pink flowers, ripples spreading and petals drifting on dark water. Dark.</span><code>/plugin install koi-pond --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/lantern-festival.svg" alt="lantern-festival" loading="lazy"></div><figcaption><strong>lantern-festival</strong><span>A lantern festival on a lake at night: paper lanterns rising into a starry sky, their warm light shimmering on the water, a pagoda and hills in silhouette. Dark.</span><code>/plugin install lantern-festival --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/low-orbit.svg" alt="low-orbit" loading="lazy"></div><figcaption><strong>low-orbit</strong><span>A pixel-art view of space: a ringed gas giant, a small moon, a nebula, parallax stars, a passing ship and shooting stars. Dark.</span><code>/plugin install low-orbit --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/meadow-hours.svg" alt="meadow-hours" loading="lazy"></div><figcaption><strong>meadow-hours</strong><span>A rolling meadow that follows your clock: dawn, day, dusk and night, with a moving sun and moon, butterflies by day and fireflies after dark. Dark.</span><code>/plugin install meadow-hours --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/midnight-ink.png" alt="midnight-ink" loading="lazy"></div><figcaption><strong>midnight-ink</strong><span>Blue-black ink with pale paper-white text and a periwinkle accent. Dark, colors only.</span><code>/plugin install midnight-ink --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/moonlit-shore.svg" alt="moonlit-shore" loading="lazy"></div><figcaption><strong>moonlit-shore</strong><span>A pixel-art beach at night: a moon and its glitter on the sea, stars, a campfire with sparks, a lantern boat and a crab. Dark.</span><code>/plugin install moonlit-shore --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/neon-rain.svg" alt="neon-rain" loading="lazy"></div><figcaption><strong>neon-rain</strong><span>A pixel-art city at night in the rain: towers with lit windows, buzzing neon signs, a wet street and a passing car. Dark.</span><code>/plugin install neon-rain --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/neon-rain-calm.svg" alt="neon-rain-calm" loading="lazy"></div><figcaption><strong>neon-rain-calm</strong><span>A calm version of neon-rain: the same scene slowed to about 40% speed and softened under a veil, with heavier frosted panels, for when motion is distracting. Dark</span><code>/plugin install neon-rain-calm --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/new-year-fireworks.svg" alt="new-year-fireworks" loading="lazy"></div><figcaption><strong>new-year-fireworks</strong><span>New Year's night over a city: rockets climbing and bursting in rings of colored sparks that fall as they fade, lit windows and stars through the smoke. Dark.</span><code>/plugin install new-year-fireworks --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/new-year-fireworks-calm.svg" alt="new-year-fireworks-calm" loading="lazy"></div><figcaption><strong>new-year-fireworks-calm</strong><span>A calm version of new-year-fireworks: the same scene slowed to about 40% speed and softened under a veil, with heavier frosted panels, for when motion is distracting. Dark</span><code>/plugin install new-year-fireworks-calm --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/night-market.svg" alt="night-market" loading="lazy"></div><figcaption><strong>night-market</strong><span>A pixel-art night market: strings of paper lanterns swinging over a lane, two glowing food stalls with rising steam, puddles that carry the light and a cat on a crate. Dark.</span><code>/plugin install night-market --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/night-train.svg" alt="night-train" loading="lazy"></div><figcaption><strong>night-train</strong><span>A night run seen from a carriage window: hills, town lights and telegraph poles sliding past under a thin moon. Dark.</span><code>/plugin install night-train --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/origami-bay.svg" alt="origami-bay" loading="lazy"></div><figcaption><strong>origami-bay</strong><span>A bay made of folded paper: layered paper waves that drift, an origami sailboat bobbing, folded cranes flying across a paper sun and clouds. Light.</span><code>/plugin install origami-bay --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/oscilloscope.svg" alt="oscilloscope" loading="lazy"></div><figcaption><strong>oscilloscope</strong><span>An oscilloscope screen: a glowing green graticule with a sine, a two-tone, a square and a triangle wave scrolling across and a cursor sweeping the display. Dark.</span><code>/plugin install oscilloscope --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/oscilloscope-calm.svg" alt="oscilloscope-calm" loading="lazy"></div><figcaption><strong>oscilloscope-calm</strong><span>A calm version of oscilloscope: the same scene slowed to about 40% speed and softened under a veil, with heavier frosted panels, for when motion is distracting. Dark</span><code>/plugin install oscilloscope-calm --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/paperback.png" alt="paperback" loading="lazy"></div><figcaption><strong>paperback</strong><span>A well-read paperback: cream pages, brown-black ink and an ink-blue accent. Light, colors only.</span><code>/plugin install paperback --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/papercut-peaks.svg" alt="papercut-peaks" loading="lazy"></div><figcaption><strong>papercut-peaks</strong><span>Five sheets of colored paper layered into mountains, each casting a soft shadow, with paper clouds and birds. Light.</span><code>/plugin install papercut-peaks --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/papercut-peaks-night.svg" alt="papercut-peaks-night" loading="lazy"></div><figcaption><strong>papercut-peaks-night</strong><span>The paper-cut mountains in deep indigo under a paper moon and cut-out stars. Dark.</span><code>/plugin install papercut-peaks-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/pirate-cove.svg" alt="pirate-cove" loading="lazy"></div><figcaption><strong>pirate-cove</strong><span>A pirate galleon in a sunny cove: a skull flag waving, gulls overhead, a far sail on the horizon and a treasure chest on a palm beach. Light.</span><code>/plugin install pirate-cove --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/pirate-cove-night.svg" alt="pirate-cove-night" loading="lazy"></div><figcaption><strong>pirate-cove-night</strong><span>A pirate galleon under a full moon: a skull flag waving, lantern light at the stern, a far ship on the horizon and a treasure chest glowing on a palm islet. Dark.</span><code>/plugin install pirate-cove-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code
