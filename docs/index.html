<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Code Themes: gallery</title><style>
body{margin:0;background:#0d0d12;color:#e8e8f0;font:16px/1.5 system-ui,sans-serif}
header{padding:32px 24px 8px;max-width:1200px;margin:0 auto}h1{margin:0 0 4px;font-size:28px}p{margin:0;color:#a8a8bc}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:24px;padding:24px;max-width:1200px;margin:0 auto}
figure{margin:0;background:#15151d;border-radius:12px;overflow:hidden}
.art{aspect-ratio:16/9;overflow:hidden;background:#000}.scene{width:100%;height:100%;display:block}
figcaption{padding:14px 16px 16px;display:grid;gap:6px}figcaption span{color:#b4b4c8;font-size:14px}
code{font:12px ui-monospace,monospace;color:#9fb4ff;overflow-wrap:anywhere}a{color:#9fb4ff}
</style></head><body><header><h1>Claude Code Themes</h1><p>Every backdrop in the library, animated. The app also tints its panels to match; this page shows the scenes only (themes with colors only show their palette). <a href="https://github.com/PerspicaciousGuy/ClaudeCodeThemes">Install and make your own</a>.</p></header><main><figure><div class="art"><img class="scene" src="previews/abyss-lantern.svg" alt="abyss-lantern" loading="lazy"></div><figcaption><strong>abyss-lantern</strong><span>The deep sea: sun shafts fading into the dark, glowing jellyfish, swaying kelp, bubbles and a passing school of fish. Dark.</span><code>/plugin install abyss-lantern --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/arcade-hall.svg" alt="arcade-hall" loading="lazy"></div><figcaption><strong>arcade-hall</strong><span>A pixel-art arcade at night: rows of cabinets playing their own little games, neon tubes and a patterned carpet. Dark.</span><code>/plugin install arcade-hall --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/aurora-field.svg" alt="aurora-field" loading="lazy"></div><figcaption><strong>aurora-field</strong><span>Northern lights over a frozen lake ringed by pines, with twinkling stars and the odd shooting star. Dark.</span><code>/plugin install aurora-field --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/bamboo-grove.svg" alt="bamboo-grove" loading="lazy"></div><figcaption><strong>bamboo-grove</strong><span>A bamboo grove in morning mist: tall green stalks in layers fading into haze, leaves swaying, slow light shafts and a few leaves falling. Light.</span><code>/plugin install bamboo-grove --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/beacon-cove.svg" alt="beacon-cove" loading="lazy"></div><figcaption><strong>beacon-cove</strong><span>An animated pixel-art theme that follows your clock: a lighthouse cape and sea from night through dawn, day and dusk, with a moving sun and moon, drifting clouds, a small boat and fireflies.</span><code>/plugin install beacon-cove --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/cloud-sea.svg" alt="cloud-sea" loading="lazy"></div><figcaption><strong>cloud-sea</strong><span>Sunrise above a sea of clouds: rolling banks of cloud drifting between dark peaks, a low sun, birds and a pastel sky from peach to blue. Light.</span><code>/plugin install cloud-sea --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/code-rain.svg" alt="code-rain" loading="lazy"></div><figcaption><strong>code-rain</strong><span>Columns of falling glyphs in phosphor green, bright at the head and fading behind, dimmer under the chat. Dark.</span><code>/plugin install code-rain --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/colorblind-safe-dark.png" alt="colorblind-safe-dark" loading="lazy"></div><figcaption><strong>colorblind-safe-dark</strong><span>A dark theme whose colors stay apart for red-green and blue-yellow color blindness: blue and orange for added and removed, and a different lightness for each status. Colors only.</span><code>/plugin install colorblind-safe-dark --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/colorblind-safe-light.png" alt="colorblind-safe-light" loading="lazy"></div><figcaption><strong>colorblind-safe-light</strong><span>A light theme whose colors stay apart for red-green and blue-yellow color blindness: blue and orange for added and removed, and a different lightness for each status. Colors only.</span><code>/plugin install colorblind-safe-light --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/contour-map.svg" alt="contour-map" loading="lazy"></div><figcaption><strong>contour-map</strong><span>A topographic survey on warm paper: elevation lines draw themselves one height at a time around a flat basin. Light.</span><code>/plugin install contour-map --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/contour-map-night.svg" alt="contour-map-night" loading="lazy"></div><figcaption><strong>contour-map-night</strong><span>The topographic survey in pale ink on blue-black paper, with the contours drawing themselves. Dark.</span><code>/plugin install contour-map-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/coral-reef.svg" alt="coral-reef" loading="lazy"></div><figcaption><strong>coral-reef</strong><span>A sunlit coral reef: caustic light rippling over branching corals and sea fans, schools of bright fish, a clownfish in an anemone, a turtle gliding by and rising bubbles. Dark.</span><code>/plugin install coral-reef --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/desert-night.svg" alt="desert-night" loading="lazy"></div><figcaption><strong>desert-night</strong><span>A desert after dark: stars and a cold moon over blue-violet mesas, saguaros in silhouette, a campfire with sparks and an owl. Dark.</span><code>/plugin install desert-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/desert-noon.svg" alt="desert-noon" loading="lazy"></div><figcaption><strong>desert-noon</strong><span>A bright desert at midday: red mesas, a pale sun, saguaros, heat shimmer, drifting dust and a tumbleweed. Light.</span><code>/plugin install desert-noon --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/fog-valley.svg" alt="fog-valley" loading="lazy"></div><figcaption><strong>fog-valley</strong><span>A misty mountain morning: blue ridges with fog drifting between them, low sun rays, a flock of birds and a far balloon. Light.</span><code>/plugin install fog-valley --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/fog-valley-night.svg" alt="fog-valley-night" loading="lazy"></div><figcaption><strong>fog-valley-night</strong><span>A misty mountain night: a moon over deep-blue ridges, pale fog drifting between them, fireflies in the pines and a sky lantern rising. Dark.</span><code>/plugin install fog-valley-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/forest-floor.png" alt="forest-floor" loading="lazy"></div><figcaption><strong>forest-floor</strong><span>Moss, bark and fern: a green-brown dark theme and a pale lichen light one, with a fern-green accent. Colors only.</span><code>/plugin install forest-floor --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/forest-trail.svg" alt="forest-trail" loading="lazy"></div><figcaption><strong>forest-trail</strong><span>A pixel-art forest trail on a bright morning: sunbeams through layered trees, a winding dirt path, drifting mist, butterflies and falling leaves. Light.</span><code>/plugin install forest-trail --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/graphite.png" alt="graphite" loading="lazy"></div><figcaption><strong>graphite</strong><span>Neutral graphite grays with one steel-blue accent. Quiet and tool-like, light and dark, colors only.</span><code>/plugin install graphite --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/greenhouse-rain.svg" alt="greenhouse-rain" loading="lazy"></div><figcaption><strong>greenhouse-rain</strong><span>A glass greenhouse at dusk in the rain: streaks and drops running down the panes, big leaves and ferns swaying inside, warm hanging lamps and a drifting mist. Dark.</span><code>/plugin install greenhouse-rain --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/halftone-harbor.svg" alt="halftone-harbor" loading="lazy"></div><figcaption><strong>halftone-harbor</strong><span>A two-ink halftone print of a harbor at sunset: a coral sun and its wake, blue water, a headland with a lighthouse, two boats. Light.</span><code>/plugin install halftone-harbor --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/halftone-harbor-night.svg" alt="halftone-harbor-night" loading="lazy"></div><figcaption><strong>halftone-harbor-night</strong><span>The halftone harbor printed on night-blue stock: an ember sun and pale-blue water in breathing dots. Dark.</span><code>/plugin install halftone-harbor-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/haunted-manor.svg" alt="haunted-manor" loading="lazy"></div><figcaption><strong>haunted-manor</strong><span>A pixel-art haunted manor under a huge moon: flickering windows, bats crossing the sky, a bare tree, drifting ground fog and an iron fence. Dark.</span><code>/plugin install haunted-manor --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/hearth.svg" alt="hearth" loading="lazy"></div><figcaption><strong>hearth</strong><span>A warm theme: espresso and cream surfaces, terracotta accents, and a slow dusk backdrop with embers drifting up.</span><code>/plugin install hearth --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/high-contrast-dark.png" alt="high-contrast-dark" loading="lazy"></div><figcaption><strong>high-contrast-dark</strong><span>Pure black and white with bright, saturated colors: text well past the AA bar on every surface, and strong borders. Dark, colors only.</span><code>/plugin install high-contrast-dark --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/high-contrast-light.png" alt="high-contrast-light" loading="lazy"></div><figcaption><strong>high-contrast-light</strong><span>Black on white with deep, saturated colors: text well past the AA bar on every surface, and strong borders. Light, colors only.</span><code>/plugin install high-contrast-light --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/koi-pond.svg" alt="koi-pond" loading="lazy"></div><figcaption><strong>koi-pond</strong><span>A koi pond seen from above at dusk: orange and white koi gliding in slow loops, lily pads with pink flowers, ripples spreading and petals drifting on dark water. Dark.</span><code>/plugin install koi-pond --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/lantern-festival.svg" alt="lantern-festival" loading="lazy"></div><figcaption><strong>lantern-festival</strong><span>A lantern festival on a lake at night: paper lanterns rising into a starry sky, their warm light shimmering on the water, a pagoda and hills in silhouette. Dark.</span><code>/plugin install lantern-festival --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/low-orbit.svg" alt="low-orbit" loading="lazy"></div><figcaption><strong>low-orbit</strong><span>A pixel-art view of space: a ringed gas giant, a small moon, a nebula, parallax stars, a passing ship and shooting stars. Dark.</span><code>/plugin install low-orbit --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/meadow-hours.svg" alt="meadow-hours" loading="lazy"></div><figcaption><strong>meadow-hours</strong><span>A rolling meadow that follows your clock: dawn, day, dusk and night, with a moving sun and moon, butterflies by day and fireflies after dark. Dark.</span><code>/plugin install meadow-hours --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/midnight-ink.png" alt="midnight-ink" loading="lazy"></div><figcaption><strong>midnight-ink</strong><span>Blue-black ink with pale paper-white text and a periwinkle accent. Dark, colors only.</span><code>/plugin install midnight-ink --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/moonlit-shore.svg" alt="moonlit-shore" loading="lazy"></div><figcaption><strong>moonlit-shore</strong><span>A pixel-art beach at night: a moon and its glitter on the sea, stars, a campfire with sparks, a lantern boat and a crab. Dark.</span><code>/plugin install moonlit-shore --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/neon-rain.svg" alt="neon-rain" loading="lazy"></div><figcaption><strong>neon-rain</strong><span>A pixel-art city at night in the rain: towers with lit windows, buzzing neon signs, a wet street and a passing car. Dark.</span><code>/plugin install neon-rain --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/night-market.svg" alt="night-market" loading="lazy"></div><figcaption><strong>night-market</strong><span>A pixel-art night market: strings of paper lanterns swinging over a lane, two glowing food stalls with rising steam, puddles that carry the light and a cat on a crate. Dark.</span><code>/plugin install night-market --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/night-train.svg" alt="night-train" loading="lazy"></div><figcaption><strong>night-train</strong><span>A night run seen from a carriage window: hills, town lights and telegraph poles sliding past under a thin moon. Dark.</span><code>/plugin install night-train --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/paperback.png" alt="paperback" loading="lazy"></div><figcaption><strong>paperback</strong><span>A well-read paperback: cream pages, brown-black ink and an ink-blue accent. Light, colors only.</span><code>/plugin install paperback --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/papercut-peaks.svg" alt="papercut-peaks" loading="lazy"></div><figcaption><strong>papercut-peaks</strong><span>Five sheets of colored paper layered into mountains, each casting a soft shadow, with paper clouds and birds. Light.</span><code>/plugin install papercut-peaks --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/papercut-peaks-night.svg" alt="papercut-peaks-night" loading="lazy"></div><figcaption><strong>papercut-peaks-night</strong><span>The paper-cut mountains in deep indigo under a paper moon and cut-out stars. Dark.</span><code>/plugin install papercut-peaks-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/pixel-cafe.svg" alt="pixel-cafe" loading="lazy"></div><figcaption><strong>pixel-cafe</strong><span>A pixel-art cafe on a rainy night: rain running down a big window over blurred city lights, warm pendant lamps, a steaming cup on the counter and a cat asleep on the sill. Dark.</span><code>/plugin install pixel-cafe --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/rainy-window.svg" alt="rainy-window" loading="lazy"></div><figcaption><strong>rainy-window</strong><span>A night city seen through a rain-streaked window: soft bokeh lights, drops sliding down the glass, a warm lamp and a steaming mug. Dark.</span><code>/plugin install rainy-window --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/reading-room.svg" alt="reading-room" loading="lazy"></div><figcaption><strong>reading-room</strong><span>A cozy library at night: tall shelves of books, a floor lamp with dust turning in its light, a candle, a cup of tea and a sleeping cat. Dark.</span><code>/plugin install reading-room --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/retro-grid.svg" alt="retro-grid" loading="lazy"></div><figcaption><strong>retro-grid</strong><span>A neon horizon: a slatted sun, wireframe mountains and a perspective grid that rolls toward you. Dark.</span><code>/plugin install retro-grid --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/rooftop-garden.svg" alt="rooftop-garden" loading="lazy"></div><figcaption><strong>rooftop-garden</strong><span>A pixel-art rooftop at golden hour: a pastel skyline, planters of sunflowers and tomatoes, string lights, birds on a wire and a kite. Light.</span><code>/plugin install rooftop-garden --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/rooftop-garden-night.svg" alt="rooftop-garden-night" loading="lazy"></div><figcaption><strong>rooftop-garden-night</strong><span>A pixel-art rooftop after dark: a moon and stars over a skyline of lit windows, glowing string lights, fireflies and a lantern. Dark.</span><code>/plugin install rooftop-garden-night --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/sakura-drift.svg" alt="sakura-drift" loading="lazy"></div><figcaption><strong>sakura-drift</strong><span>A spring dusk of pastel sky, misty hills and a blossoming tree, with petals drifting down. Light and dark.</span><code>/plugin install sakura-drift --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/snow-cabin.svg" alt="snow-cabin" loading="lazy"></div><figcaption><strong>snow-cabin</strong><span>A winter night: a log cabin with a lit window, smoke curling from the chimney, snowy pines and snow falling in three layers. Dark.</span><code>/plugin install snow-cabin --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/snow-cabin-day.svg" alt="snow-cabin-day" loading="lazy"></div><figcaption><strong>snow-cabin-day</strong><span>A winter noon: a pale blue sky and low sun, white hills, a log cabin with smoke from its chimney and snow falling in three layers. Light.</span><code>/plugin install snow-cabin-day --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/snow-station.svg" alt="snow-station" loading="lazy"></div><figcaption><strong>snow-station</strong><span>A pixel-art train station in a night snowfall: snow drifting past warm lamps, a slow night train on the far track, a glowing clock on the gable and a bench under the canopy. Dark.</span><code>/plugin install snow-station --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/sunny-shore.svg" alt="sunny-shore" loading="lazy"></div><figcaption><strong>sunny-shore</strong><span>A pixel-art beach on a bright day: a pulsing sun, drifting clouds, a sparkling sea, rolling foam, palms, gulls and a crab. Light.</span><code>/plugin install sunny-shore --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/tide-pool.svg" alt="tide-pool" loading="lazy"></div><figcaption><strong>tide-pool</strong><span>Looking straight down into a rock pool: breathing anemones, starfish, rippling light, drops making rings and small fish. Dark.</span><code>/plugin install tide-pool --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure><figure><div class="art"><img class="scene" src="previews/torch-dungeon.svg" alt="torch-dungeon" loading="lazy"></div><figcaption><strong>torch-dungeon</strong><span>A pixel-art dungeon wall: two flickering torches, a dark doorway with watching eyes, bats, a hopping slime and a treasure chest. Dark.</span><code>/plugin install torch-dungeon --marketplace PerspicaciousGuy/ClaudeCodeThemes</code></figcaption></figure></main></body></html>
