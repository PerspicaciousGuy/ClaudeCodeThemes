<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>
.drift{animation:drift var(--d,110s) ease-in-out infinite alternate}
.tw{animation:tw var(--d,4s) ease-in-out infinite alternate;animation-delay:var(--l,0s)}
.smoke{animation:smoke var(--d,9s) ease-out infinite;animation-delay:var(--l,0s)}
.ripple{animation:ripple var(--d,6s) ease-in-out infinite alternate;animation-delay:var(--l,0s)}
.win{animation:tw 5s ease-in-out infinite alternate}
.bird{animation:bird var(--d,70s) linear infinite;animation-delay:var(--l,0s)}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(140px)}}
@keyframes tw{from{opacity:.35}to{opacity:1}}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.45}100%{transform:translate(50px,-200px) scale(1.6);opacity:0}}
@keyframes ripple{from{transform:scaleX(.85)}to{transform:scaleX(1.1)}}
@keyframes bird{from{transform:translateX(-120px)}to{transform:translateX(1760px)}}
@media (prefers-reduced-motion:reduce){.drift,.tw,.smoke,.ripple,.win,.bird{animation:none}}
</style><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f81d4"/><stop offset="1" stop-color="#cad9e2"/></linearGradient><radialGradient id="sun"><stop offset="0" stop-color="#fff2c8" stop-opacity=".95"/><stop offset="1" stop-color="#ffc878" stop-opacity="0"/></radialGradient><radialGradient id="moon"><stop offset="0" stop-color="#e8eeff" stop-opacity=".6"/><stop offset="1" stop-color="#e8eeff" stop-opacity="0"/></radialGradient><radialGradient id="lamp"><stop offset="0" stop-color="#ffb860" stop-opacity=".85"/><stop offset="1" stop-color="#ffb860" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#sky)"/><circle cx="862" cy="163" r="300" fill="url(#sun)"/><circle cx="862" cy="163" r="58" fill="#fff6d8"/><g class="drift"><g fill="#ecf2f5" opacity="0.55"><ellipse cx="380" cy="190" rx="230" ry="28"/><ellipse cx="520" cy="222" rx="180" ry="22"/><ellipse cx="1180" cy="150" rx="260" ry="26"/></g></g><path d="M0 640 C 220 560 420 600 640 590 C 880 580 1060 520 1300 560 C 1440 584 1540 570 1600 560 L1600 700 L0 700 Z" fill="#697986"/><path d="M0 690 C 300 640 600 690 900 676 C 1160 664 1400 690 1600 666 L1600 900 L0 900 Z" fill="#3c4a52"/><rect x="0" y="700" width="1600" height="200" fill="#5a6a77"/><g class="ripple" style="--d:5.0s;--l:-3.3s;transform-box:fill-box;transform-origin:center"><ellipse cx="859" cy="716" rx="40" ry="3" fill="#ffe8b8" fill-opacity="0.35"/></g><g class="ripple" style="--d:5.2s;--l:-2.9s;transform-box:fill-box;transform-origin:center"><ellipse cx="848" cy="736" rx="48" ry="3" fill="#ffe8b8" fill-opacity="0.35"/></g><g class="ripple" style="--d:6.7s;--l:-0.9s;transform-box:fill-box;transform-origin:center"><ellipse cx="834" cy="756" rx="56" ry="3" fill="#ffe8b8" fill-opacity="0.35"/></g><g class="ripple" style="--d:6.2s;--l:-2.0s;transform-box:fill-box;transform-origin:center"><ellipse cx="852" cy="776" rx="64" ry="3" fill="#ffe8b8" fill-opacity="0.35"/></g><g class="ripple"