<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb6e2"/><stop offset="0.45" stop-color="#c8d4ec"/><stop offset="0.72" stop-color="#f6d6c6"/><stop offset="1" stop-color="#fbe6c4"/></linearGradient><radialGradient id="sun"><stop offset="0" stop-color="#fff2c8" stop-opacity="0.95"/><stop offset="1" stop-color="#fff2c8" stop-opacity="0"/></radialGradient><radialGradient id="warm"><stop offset="0" stop-color="#ffb48a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffb48a" stop-opacity="0"/></radialGradient><linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3d4"/><stop offset="1" stop-color="#e8c8c8"/></linearGradient><linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e6"/><stop offset="1" stop-color="#e8d4dc"/></linearGradient><linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcd8ee"/></linearGradient><linearGradient id="c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f2fc"/><stop offset="1" stop-color="#c8cce4"/></linearGradient></defs><style>
.c1{animation:cd 160s ease-in-out infinite alternate}
.c2{animation:cd 120s ease-in-out infinite alternate-reverse}
.c3{animation:cd 90s ease-in-out infinite alternate}
.c4{animation:cd 70s ease-in-out infinite alternate-reverse}
.glow{animation:glow 12s ease-in-out infinite alternate}
.bird{animation:bird var(--d,60s) linear infinite;animation-delay:var(--l,0s)}
.flap{animation:flap .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes cd{from{transform:translateX(-110px)}to{transform:translateX(110px)}}
@keyframes glow{from{opacity:.7}to{opacity:1}}
@keyframes bird{from{transform:translateX(-120px)}to{transform:translateX(1760px)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.c1,.c2,.c3,.c4,.glow,.bird,.flap{animation:none}}
